<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="prof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#prof-grad)" stroke-width="12" opacity="0.4"/>

  <!-- Outer gear accent for profession/engineering -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#prof-grad)" stroke-width="16" stroke-dasharray="24 16"/>

  <!-- Code brackets -->
  <path d="M 140 180 L 80 256 L 140 332" stroke="url(#prof-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 372 180 L 432 256 L 372 332" stroke="url(#prof-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Workstation & Developer Silhouette -->
  <!-- Monitor screen -->
  <rect x="180" y="160" width="152" height="100" rx="12" fill="none" stroke="url(#prof-grad)" stroke-width="16"/>
  <path d="M 236 260 L 236 290 M 210 290 L 302 290" stroke="url(#prof-grad)" stroke-width="16" stroke-linecap="round"/>
  <!-- Code lines on monitor -->
  <line x1="204" y1="190" x2="270" y2="190" stroke="url(#prof-grad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="204" y1="216" x2="308" y2="216" stroke="url(#prof-grad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Developer Head & Shoulders Silhouette -->
  <circle cx="256" cy="340" r="32" fill="url(#prof-grad)"/>
  <path d="M 196 420 C 196 376 316 376 316 420" fill="url(#prof-grad)"/>
</svg>
